name: Verify and deploy storefront
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ruaa_test
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: ruaa_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:seo
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://ruaa_test:local-ci-test-only@localhost:5432/ruaa_admin_test

  deploy:
    name: Deploy production
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_SLUG: ishswamitech-1274s-projects
      VERCEL_CLI_VERSION: '64.5.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Check deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo '::error::Add VERCEL_TOKEN to the production environment secrets.'; exit 1; }
          test "$VERCEL_ORG_ID" = 'team_gZnhGiNvZNh8tCbbzHRECptV'
          test "$VERCEL_PROJECT_ID" = 'prj_BiBr9sxkPmnCICYe2BB6DuzglEje'
      - name: Install Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - run: npm ci
      - name: Pull production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --scope "$VERCEL_TEAM_SLUG"
      - name: Build production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --scope "$VERCEL_TEAM_SLUG"
      - name: Stage production deployment
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy --prebuilt --prod --skip-domain --yes --no-wait --json --scope "$VERCEL_TEAM_SLUG" > "$RUNNER_TEMP/vercel-deployment.json"
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/vercel-deployment.json`, 'utf8'));
          const deployment = result.deployment ?? result;
          if (result.status === 'error' || result.error || typeof deployment.url !== 'string') throw new Error('Production deployment was not created');
          const url = new URL(deployment.url.includes('://') ? deployment.url : `https://${deployment.url}`);
          if (url.protocol !== 'https:' || url.username || url.password || url.pathname !== '/' || url.search || url.hash || !url.hostname.endsWith('.vercel.app')) throw new Error('Unexpected deployment URL');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url.origin}\n`);
          NODE
      - name: Wait for staged deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          for attempt in $(seq 1 30); do
            vercel inspect "$DEPLOYMENT_URL" --json --scope "$VERCEL_TEAM_SLUG" > "$RUNNER_TEMP/vercel-inspection.json"
            state=$(node -e 'const fs = require("node:fs"); const d = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/vercel-inspection.json`, "utf8")); if (!d.readyState) throw new Error("Deployment status missing"); console.log(d.readyState);')
            case "$state" in
              READY) exit 0 ;;
              BLOCKED|ERROR|CANCELED)
                node -e 'const fs = require("node:fs"); const d = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/vercel-inspection.json`, "utf8")); console.error(`Deployment ${d.readyState}: ${d.readyStateReason || "See the Vercel deployment dashboard."}`);'
                exit 1 ;;
              *) echo "Deployment status: $state" ;;
            esac
            sleep 10
          done
          echo '::error::Deployment did not become ready within five minutes.'
          exit 1
      - name: Verify staged pages
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          vercel inspect "$DEPLOYMENT_URL" --json --scope "$VERCEL_TEAM_SLUG" > "$RUNNER_TEMP/vercel-inspection.json"
          node <<'NODE'
          const fs = require('node:fs');
          const deployment = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/vercel-inspection.json`, 'utf8'));
          if (deployment.name !== 'ruaa-creation' || deployment.contextName !== process.env.VERCEL_TEAM_SLUG || deployment.target !== 'production' || deployment.readyState !== 'READY') throw new Error('Deployment target verification failed');
          if (`https://${deployment.url}` !== process.env.DEPLOYMENT_URL) throw new Error('Deployment URL mismatch');
          NODE
          for page in / /shop/ /checkout/ /robots.txt /sitemap.xml; do
            status=$(vercel curl "${DEPLOYMENT_URL}${page}" --scope "$VERCEL_TEAM_SLUG" -- --silent --show-error --fail --output /dev/null --write-out '%{http_code}')
            test "$status" = '200' || { echo "::error::Page $page returned $status"; exit 1; }
          done
      - name: Promote tested deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          vercel promote "$DEPLOYMENT_URL" --yes --scope "$VERCEL_TEAM_SLUG"
          echo 'Production updated: https://ruaa-creation.vercel.app' >> "$GITHUB_STEP_SUMMARY"
